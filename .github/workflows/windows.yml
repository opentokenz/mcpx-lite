name: Windows compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          version: 12.5.1
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Build Windows executables
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $source = Join-Path $workspace 'src/bin.ts'
          $dist = Join-Path $workspace 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $x64Output = Join-Path $dist 'mcpx-lite-win-x64.exe'
          $arm64Output = Join-Path $dist 'mcpx-lite-win-arm64.exe'

          # Bun's cross-target cache is on C:; keep its temporary working directory on the same drive.
          Push-Location $env:USERPROFILE
          try {
            bun build --compile --target=bun-windows-x64 --outfile $x64Output $source
            if ($LASTEXITCODE -ne 0) { throw "Windows x64 build failed with exit code $LASTEXITCODE" }

            bun build --compile --target=bun-windows-arm64 --outfile $arm64Output $source
            if ($LASTEXITCODE -ne 0) { throw "Windows ARM64 build failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
      - name: Smoke test packaged x64 executable
        shell: pwsh
        run: |
          $env:MCPX_LITE_BINARY = (Resolve-Path "dist/mcpx-lite-win-x64.exe").Path
          pnpm vitest run test/server-startup.test.ts
